server:
  port: 8080

spring:
  application:
    name: event-management-api
  datasource:
    url: jdbc:postgresql://localhost:5433/event_management_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:aPZnbybY1VJnHBZC75dqAs57foOJ3MDclfBitHyFQ+Y=}
  expiration-ms: 86400000
  cookie-secure: ${JWT_COOKIE_SECURE:false}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
